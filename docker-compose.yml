services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartech
      POSTGRES_PASSWORD: smartech
      POSTGRES_DB: smartech
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://smartech:smartech@db/smartech
    depends_on: [db]
    ports: ["5069:5069"]
volumes:
  pgdata:
